name: Build APK on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: watchtogether-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp watchtogether-android/app/build/outputs/apk/debug/app-debug.apk Vmeste-YouTube-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vmeste-YouTube-Test
          path: Vmeste-YouTube-Test.apk
          if-no-files-found: error
